services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - runs:/code/data
    environment:
      DATABASE_PATH: /code/data/runs.db
      VERIFICATION_DB: /code/data/verification_checkpoints.db
      # Ollama runs on the host machine, not inside the container.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  runs: